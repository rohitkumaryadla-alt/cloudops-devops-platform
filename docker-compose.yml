services:
  mysql:
    image: mysql:8.0
    container_name: cloudops-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: cloudops
      MYSQL_USER: cloudops
      MYSQL_PASSWORD: cloudopspassword
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

volumes:
  mysql_data: